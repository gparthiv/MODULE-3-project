<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AutoSense AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            width: 900px;
            max-width: 92%;
            margin: 50px auto;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            resize: vertical;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 15px;
            font-size: 15px;
            outline: none;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        button {
            margin-top: 15px;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .sentiment {
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .positive {
            background: #dcfce7;
            color: #166534;
        }

        .negative {
            background: #fee2e2;
            color: #991b1b;
        }

        .neutral {
            background: #f3f4f6;
            color: #374151;
        }

        .confidence {
            color: #6b7280;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        .loading {
            color: #6b7280;
            margin-top: 10px;
        }

        .example {
            margin-top: 12px;
            color: #6b7280;
            font-size: 13px;
            cursor: pointer;
        }

        .example:hover {
            color: #2563eb;
        }

        .error {
            color: #dc2626;
            margin-top: 12px;
        }
    </style>
</head>


<body>

    <div class="container">

        <div class="header">
            <h1>AutoSense AI</h1>
            <p>Automotive Review & Customer Sentiment Analytics</p>
        </div>


        <div class="card">

            <h2>Analyze Review</h2>

            <br>

            <textarea
                id="review"
                placeholder="Enter an automotive review..."
            ></textarea>

            <div
                class="example"
                onclick="useExample()"
            >
                Try example review
            </div>

            <button
                id="analyzeButton"
                onclick="analyzeReview()"
            >
                Analyze Review
            </button>

            <div
                id="loading"
                class="loading hidden"
            >
                Analyzing review...
            </div>

            <div
                id="error"
                class="error"
            ></div>

        </div>


        <div
            id="results"
            class="card hidden"
        >

            <div class="result-header">

                <div>
                    <h2>Analysis Result</h2>

                    <div
                        id="confidence"
                        class="confidence"
                    ></div>
                </div>

                <div
                    id="overallSentiment"
                    class="sentiment"
                ></div>

            </div>


            <h3>Aspect-Level Sentiment</h3>

            <br>

            <table>

                <thead>
                    <tr>
                        <th>Aspect</th>
                        <th>Sentiment</th>
                        <th>Confidence</th>
                    </tr>
                </thead>

                <tbody id="aspectTable">
                </tbody>

            </table>

        </div>

    </div>


    <script>

        function useExample() {

            document.getElementById("review").value =
                "The engine is powerful and the seats are very comfortable, " +
                "but the price is too high and the infotainment system is terrible.";

        }


        async function analyzeReview() {

            const review =
                document.getElementById("review").value.trim();

            const button =
                document.getElementById("analyzeButton");

            const loading =
                document.getElementById("loading");

            const error =
                document.getElementById("error");

            const results =
                document.getElementById("results");


            error.textContent = "";


            if (!review) {

                error.textContent =
                    "Please enter a review.";

                return;
            }


            button.disabled = true;

            loading.classList.remove("hidden");

            results.classList.add("hidden");


            try {

                const response = await fetch(
                    "/analyze",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            review: review
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok) {
                    throw new Error(data.error);
                }


                displayResults(data);


            } catch (err) {

                error.textContent =
                    err.message || "Something went wrong.";

            } finally {

                button.disabled = false;

                loading.classList.add("hidden");
            }
        }


        function displayResults(data) {

            const results =
                document.getElementById("results");

            const sentiment =
                document.getElementById("overallSentiment");

            const confidence =
                document.getElementById("confidence");

            const table =
                document.getElementById("aspectTable");


            sentiment.textContent =
                data.overall_sentiment;


            sentiment.className =
                "sentiment " +
                data.overall_sentiment.toLowerCase();


            confidence.textContent =
                "Overall confidence: " +
                (data.overall_confidence * 100).toFixed(1) +
                "%";


            table.innerHTML = "";


            if (data.aspect_sentiment.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="3">
                            No supported automotive aspects detected.
                        </td>
                    </tr>
                `;

            } else {

                data.aspect_sentiment.forEach(item => {

                    const row =
                        document.createElement("tr");


                    const aspect =
                        document.createElement("td");

                    aspect.textContent =
                        item.aspect;


                    const sentimentCell =
                        document.createElement("td");

                    sentimentCell.textContent =
                        item.sentiment;


                    const confidenceCell =
                        document.createElement("td");

                    confidenceCell.textContent =
                        (item.confidence * 100).toFixed(1) + "%";


                    row.appendChild(aspect);

                    row.appendChild(sentimentCell);

                    row.appendChild(confidenceCell);


                    table.appendChild(row);

                });
            }


            results.classList.remove("hidden");
        }

    </script>

</body>

</html>
